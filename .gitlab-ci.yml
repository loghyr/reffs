# Branch pushes, including WIP branches, do not require a merge request.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH'
    - when: never
  auto_cancel:
    on_new_commit: interruptible

default:
  image: ubuntu:24.04
  interruptible: true

variables:
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  CC: clang

build-test:
  stage: test
  timeout: 1h
  before_script:
    # Match the GitHub sanitizer workflow; container commands run as root.
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      ca-certificates build-essential clang file
      pkg-config autoconf automake autoconf-archive libtool libtool-bin
      make cmake git
      liburcu-dev libtirpc-dev check librocksdb-dev libxxhash-dev
      libfuse-dev uuid-dev zlib1g-dev libzstd-dev liburing-dev
      libjemalloc-dev libssl-dev libkrb5-dev libnfsidmap-dev libcap-dev
      rpcsvc-proto python3 python3-pip python3-venv
    - >-
      pip3 install --no-cache-dir --break-system-packages
      xdrlib3 reply-xdr@git+https://github.com/loghyr/reply.git
      clang-format==22.1.4
    - |
      histogram_dir=$(mktemp -d)
      git clone https://github.com/HdrHistogram/HdrHistogram_c.git "$histogram_dir"
      cmake -S "$histogram_dir" -B "$histogram_dir/build"
      cmake --build "$histogram_dir/build" --parallel "$(nproc)"
      cmake --install "$histogram_dir/build"
      ldconfig
  script:
    - mkdir -p m4
    - autoreconf -fi
    - make -f Makefile.reffs style CLANG_FORMAT=clang-format
    - SKIP_STYLE=1 make -f Makefile.reffs license
    - mkdir -p build
    - cd build
    - ../configure --enable-asan --enable-ubsan
    - make -j"$(nproc)"
    - make check
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/config.log
      - build/**/test-suite.log
      - build/**/*.log
      - build/**/*.trs

# Live NFS mount tests require a separate, suitably provisioned lab runner.
