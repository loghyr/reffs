name: C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Self-hosted runner on Hetzner VM — Fedora, real NFS mounts, RocksDB.
  # All deps pre-installed, no Docker.
  build-self-hosted:
    runs-on: self-hosted

    steps:
    - name: Acquire CI lock
      run: |
        LOCKFILE=/reffs_data/reffs_ci.lock
        # Match nightly_ci.sh MAX_RUNTIME: a holder older than this is
        # wedged, not working.  On 2026-07-27 a nightly hung in
        # nfs-conformance for 13h and held this lock; with no steal path
        # every push failed here after the full 10-minute wait.
        MAX_RUNTIME=$((3 * 3600))
        for i in $(seq 1 60); do
          if (set -C; echo $$ > "$LOCKFILE") 2>/dev/null; then
            echo "Lock acquired"
            break
          fi
          # Steal a stale lock: holder dead, or alive past MAX_RUNTIME.
          HOLDER=$(cat "$LOCKFILE" 2>/dev/null)
          if [ -n "$HOLDER" ] && ! kill -0 "$HOLDER" 2>/dev/null; then
            echo "Lock holder PID $HOLDER is gone -- stealing stale lock"
            rm -f "$LOCKFILE"
            continue
          fi
          if [ -f "$LOCKFILE" ]; then
            AGE=$(( $(date +%s) - $(stat -c %Y "$LOCKFILE" 2>/dev/null || date +%s) ))
            if [ "$AGE" -gt "$MAX_RUNTIME" ]; then
              echo "Lock held ${AGE}s by PID $HOLDER, past ${MAX_RUNTIME}s -- stealing"
              rm -f "$LOCKFILE"
              continue
            fi
          fi
          echo "Waiting for lock (attempt $i/60, holder PID ${HOLDER:-unknown})..."
          sleep 10
        done
        [ -f "$LOCKFILE" ] && [ "$(cat "$LOCKFILE")" = "$$" ] || exit 1

    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Create m4 directory
      run: mkdir -p m4

    - name: Autoreconf
      run: autoreconf -fi

    - name: Check style
      run: make -f Makefile.reffs style

    - name: Check license
      run: SKIP_STYLE=1 make -f Makefile.reffs license

    - name: Configure
      run: |
        mkdir -p build_ci
        cd build_ci
        ../configure --enable-asan --enable-ubsan

    - name: Build
      run: |
        cd build_ci
        make -j$(nproc)

    - name: Run unit tests
      run: |
        cd build_ci
        make check || (cat lib/fs/tests/test-suite.log && exit 1)

    - name: Run integration tests
      run: |
        sudo rpcbind 2>/dev/null || true
        # Integration test needs root for mount + port 2049.
        # Pass user's PATH so build-on-NFS finds xdr-parser.
        sudo -E env \
          "PATH=$HOME/.local/bin:/usr/local/bin:/usr/bin:/usr/sbin" \
          "LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64" \
          "HOME=$HOME" \
          bash -c "ulimit -n 65536; bash scripts/ci_integration_test.sh \
            '$(pwd)/build_ci/src/reffsd' \
            '$(pwd)'"

    - name: Clean up
      if: always()
      run: |
        rm -rf build_ci
        # Integration test mount (port 2049).  Kill reffsd first so
        # pending RPCs get ECONNREFUSED and D-state processes can wake
        # before the unmount.  Do NOT use fuser -k -m here -- that sends
        # SIGKILL to every process using the NFS filesystem, including
        # the runner itself.
        sudo fuser -k 2049/tcp 2>/dev/null || true
        sleep 1
        sudo umount -f -l /mnt/reffs 2>/dev/null || true
        sudo rm -rf /mnt/reffs 2>/dev/null || true
        # Soak test mounts left by nightly_ci.sh or local_soak.sh when
        # SIGKILL bypasses EXIT traps.  Kill the stale reffsd on port
        # 12049 first so pending RPCs get ECONNREFUSED and D-state
        # processes can wake before we force-unmount.
        sudo fuser -k 12049/tcp 2>/dev/null || true
        sleep 1
        for mp in /mnt/reffs_local_soak /mnt/reffs_soak*; do
          [ -d "$mp" ] || continue
          mountpoint -q "$mp" 2>/dev/null || continue
          sudo fuser -k -m "$mp" 2>/dev/null || true
          sleep 1
          sudo umount -f -l "$mp" 2>/dev/null || true
        done
        rm -f /reffs_data/reffs_ci.lock
