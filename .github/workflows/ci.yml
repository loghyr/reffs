name: C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # GitHub-hosted runner: build, style, license, and unit tests.
  # Deps mirror Dockerfile.ci (FROM ubuntu:24.04 == ubuntu-latest).
  # The root/NFS integration test is NOT run here -- it needs real
  # kernel NFS mounts and runs in the nightly job on garbo.
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        # Compile/link + style deps, matching Dockerfile.ci.  clang-format-18
        # is the version the tree is formatted with; the style target must
        # use it or it reports spurious diffs.
        sudo apt-get install -y \
          clang clang-format-18 clang-tidy clang-tools \
          pkg-config autoconf automake autoconf-archive libtool libtool-bin \
          make cmake git \
          liburcu-dev libtirpc-dev check librocksdb-dev libxxhash-dev \
          libfuse-dev uuid-dev zlib1g-dev libzstd-dev liburing-dev \
          libjemalloc-dev libssl-dev libkrb5-dev libnfsidmap-dev libcap-dev \
          rpcsvc-proto python3 python3-pip python3-venv

    - name: Install XDR tooling (xdr-parser / reply-xdr)
      # System-wide so xdr-parser lands on PATH (/usr/local/bin) for
      # configure's AC_PATH_PROG probe; --break-system-packages for PEP 668.
      run: |
        sudo pip3 install --no-cache-dir --break-system-packages \
          xdrlib3 \
          reply-xdr@git+https://github.com/loghyr/reply.git

    - name: Install HdrHistogram_c from source
      # The apt package is insufficient; build from source (same as CI image).
      run: |
        git clone https://github.com/HdrHistogram/HdrHistogram_c.git /tmp/HdrHistogram_c
        cmake -S /tmp/HdrHistogram_c -B /tmp/HdrHistogram_c/build
        make -C /tmp/HdrHistogram_c/build
        sudo make -C /tmp/HdrHistogram_c/build install
        sudo ldconfig
        rm -rf /tmp/HdrHistogram_c

    - name: Create m4 directory
      run: mkdir -p m4

    - name: Autoreconf
      run: autoreconf -fi

    - name: Check style
      run: make -f Makefile.reffs style CLANG_FORMAT=clang-format-18

    - name: Check license
      run: SKIP_STYLE=1 make -f Makefile.reffs license

    - name: Configure
      run: |
        mkdir -p build_ci
        cd build_ci
        ../configure --enable-asan --enable-ubsan

    - name: Build
      run: make -C build_ci -j$(nproc)

    - name: Run unit tests
      run: |
        cd build_ci
        make check || (cat lib/fs/tests/test-suite.log && exit 1)

    - name: Dump test-suite logs on failure
      if: failure()
      run: |
        for f in build_ci/lib/*/tests/*.log; do
          [ -f "$f" ] || continue
          echo "=== $f ==="; cat "$f" || true
        done
